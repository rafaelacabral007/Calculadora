<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
    <!-- Favicon da página -->
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <main class="calculadora">

        <input type="text" class="visor" id="visor">

        <div class="botoes">

            <button class="funcao">AC</button>
            <button class="funcao">⌫</button>
            <button class="funcao">%</button>
            <button class="operador">/</button>

            <button class="numero">7</button>
            <button class="numero">8</button>
            <button class="numero">9</button>
            <button class="funcao">X</button>

            <button class="numero">4</button>
            <button class="numero">5</button>
            <button class="numero">6</button>
            <button class="funcao">-</button>

            <button class="numero">1</button>
            <button class="numero">2</button>
            <button class="numero">3</button>
            <button class="funcao">+</button>

            <button class="numero">0</button>
            <button class="funcao">,</button>
            <button class="funcao">+/-</button>
            <button class="igual">=</button>

        </div>

    </main>
    <script src="script.js"></script>
    <footer class="rodape">
        <p>Calculadora • 2026</p>
        <p>Desenvolvido por Rafaela</p>

    <div class="links-rodape">
        <a href="https://www.linkedin.com/in/rafaela-cabral-46bb031b3/?skipRedirect=true" target="_blank">
            linkedin
        </a>
        <a href="https://github.com/rafaelacabral007" target="_blank">
            GitHub
        </a>
    </div>
    </footer>
</body>
</html>
